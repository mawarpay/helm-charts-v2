name:	Release	Helm	chart	to	ECR
on:
	push:
		branches:	[main]
		paths:	["charts/**"]

permissions:
	contents:	read

jobs:
	release:
		runs-on: ubuntu-latest
		steps:
			-	uses:	actions/checkout@v4

			-	uses:	aws-actions/configure-aws-credentials@v4
				with:
					aws-access-key-id:	${{	secrets.AWS_ACCESS_KEY_ID	}}
					aws-secret-access-key:	${{	secrets.AWS_SECRET_ACCESS_KEY	}}
					aws-region:	ap-southeast-1

			-	name:	Helm	login	ke	ECR
					run:	|
  					aws	ecr	get-login-password	--region	ap-southeast-1	|	\
						helm	registry	login	--username	AWS	--password-stdin	\
						${{	secrets.AWS_ACCOUNT_ID	}}.dkr.ecr.ap-southeast-1.amazonaws.com

			-	name:	Package	&	push
				run:	|
					helm	package	charts/app
					CHART_VERSION=$(grep	'^version:'	charts/app/Chart.yaml	|	awk	'{print	$2}')
					helm	push	app-${CHART_VERSION}.tgz	\
						oci://${{	secrets.AWS_ACCOUNT_ID	}}.dkr.ecr.ap-southeast-1.amazonaws.com/helm
