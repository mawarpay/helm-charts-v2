# ---------------------------------------------------------------------------
# Values PRODUCTION - diturunkan dari values/dev/api-gateway-service.yaml.
#
# Dev dan prod satu cluster EKS: yang memisahkan cuma namespace (default vs
# prod) dan path Vault (secret/dev/* vs secret/prod/*).
#
# vault.stage dan vault.storeName TIDAK perlu ditulis di sini - workflow deploy
# memaksanya lewat --set. Kalau ditulis pun akan ditimpa.
#
# Sebelum deploy pertama, cek yang bergantung kapasitas/DNS:
#   - replicaCount & resources di bawah (default 1 replica, lihat catatan di
#     bawah replicaCount)
#   - host ingress sudah punya DNS record + sertifikat
# ---------------------------------------------------------------------------

# Diturunkan 2 -> 1 replica (2026-08-06).
#
# Alasannya kapasitas, sama seperti catatan CPU di bawah: 35 service x 2
# replica tidak muat di lima node dan menyisakan 76 pod Pending. Dengan 1
# replica semua service bisa dijadwalkan.
#
# Konsekuensinya prod jalan tanpa redundansi - rolling update dan node drain
# berarti downtime singkat per service. Ini kompromi sadar selama quota vCPU
# akun (16, sudah penuh; request naik ke 64 masih PENDING) belum naik.
# Kembalikan ke 2 setelah node bertambah.
replicaCount: 1

image:
  repository: 672061768993.dkr.ecr.ap-southeast-1.amazonaws.com/api-gateway-service

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://portal.mawarpay.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
  hosts:
    - host: api.mawarpay.com
      paths:
        - path: /
          pathType: Prefix

env:
  APP_ENV: prod

# CPU request diturunkan 100m -> 25m (2026-08-06).
#
# Bukan penghematan, tapi supaya pod bisa dijadwalkan sama sekali: 35 service
# x 2 replica x 100m = 7 CPU request, sementara lima node cuma punya ~12 vCPU
# dan sudah 95-98% ter-request. Pemakaian CPU nyata di node cuma 2-21%, jadi
# 100m itu over-request sekitar 4x - schedulerlah yang kehabisan, bukan CPU.
#
# Quota vCPU EC2 akun ini 16 dan sudah terpakai penuh (request naik ke 64
# sedang PENDING), jadi menambah node bukan pilihan yang tersedia sekarang.
# Kalau quota sudah naik dan node bertambah, angka ini boleh dinaikkan lagi -
# tapi ukur dulu pakai `kubectl top pods -n prod`, jangan balik ke 100m
# begitu saja.
#
# limits sengaja tidak diturunkan: burst saat startup (migrasi GORM, koneksi
# pool) butuh ruang, dan limits tidak ikut dihitung scheduler.
resources:
  requests:
    cpu: 25m
