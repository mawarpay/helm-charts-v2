# ---------------------------------------------------------------------------
# Values PRODUCTION - diturunkan dari values/dev/image-service-api.yaml.
#
# Dev dan prod satu cluster EKS: yang memisahkan cuma namespace (default vs
# prod) dan path Vault (secret/dev/* vs secret/prod/*).
#
# vault.stage dan vault.storeName TIDAK perlu ditulis di sini - workflow deploy
# memaksanya lewat --set. Kalau ditulis pun akan ditimpa.
#
# Sebelum deploy pertama, cek yang bergantung kapasitas/DNS:
#   - replicaCount & resources di bawah (default dinaikkan ke 2 replica)
#   - host ingress sudah punya DNS record + sertifikat
# ---------------------------------------------------------------------------

replicaCount: 1
image:
  repository: 672061768993.dkr.ecr.ap-southeast-1.amazonaws.com/image-service-api

service:
  targetPort: 8080

env:
  APP_ENV: prod

# PP-155: IRSA instead of static S3_ACCESS_KEY/S3_SECRET_KEY in Vault. The S3
# client (internal/storage/s3/s3.go) already falls back to the AWS SDK's
# default credential chain - which picks up IRSA automatically - whenever
# those two fields are empty, so no app code change was needed.
#
# Sequencing: do NOT blank S3_ACCESS_KEY/S3_SECRET_KEY in
# secret/prod/image-service-api until AFTER this deploys successfully with
# the new ServiceAccount - removing them first would break the currently
# running pods, which still need static creds until their replacement is
# live.
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::672061768993:role/image-service-api-prod-s3"