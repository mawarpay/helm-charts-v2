# ---------------------------------------------------------------------------
# Values PRODUCTION - diturunkan dari values/dev/admin-v2.yaml.
#
# Dev dan prod satu cluster EKS: yang memisahkan cuma namespace (default vs
# prod) dan path Vault (secret/dev/* vs secret/prod/*).
#
# vault.stage dan vault.storeName TIDAK perlu ditulis di sini - workflow deploy
# memaksanya lewat --set. Kalau ditulis pun akan ditimpa.
#
# Sebelum deploy pertama, cek yang bergantung kapasitas/DNS:
#   - replicaCount & resources di bawah (default dinaikkan ke 2 replica)
#   - host ingress sudah punya DNS record + sertifikat
# ---------------------------------------------------------------------------

replicaCount: 2

image:
  repository: 672061768993.dkr.ecr.ap-southeast-1.amazonaws.com/admin-v2

# mengalami error 502 jika targetPort tidak di set ke 80
service:
  port: 80
  targetPort: 80

containerPort: 80

# liveness & readiness probe ke Port 80 & Path '/'
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: admin.mawarpay.com
      paths:
        - path: /
          pathType: Prefix

env:
  APP_ENV: prod