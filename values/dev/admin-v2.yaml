image:
  repository: 672061768993.dkr.ecr.ap-southeast-1.amazonaws.com/admin-v2

# mengalami error 502 jika targetPort tidak di set ke 80
service:
  port: 80
  targetPort: 80

containerPort: 80

# liveness & readiness probe ke Port 80 & Path '/'
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: admin-dev.mawarpay.com
      paths:
        - path: /
          pathType: Prefix

env:
  APP_ENV: dev