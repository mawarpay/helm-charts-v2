image:
  repository: 672061768993.dkr.ecr.ap-southeast-1.amazonaws.com/api-gateway-service

service:
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.mawarpay.com
      paths:
        - path: /
          pathType: Prefix

env:
  APP_ENV: dev
  AUTH_SERVICE_URL: http://auth-service.dev.svc.cluster.local
  TRANSACTION_SERVICE_URL: http://transaction-service.dev.svc.cluster.local

  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200