{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}-vault
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    # Dev dan prod berbagi satu cluster, jadi ClusterSecretStore-nya dipisah per
    # environment: "vault-kv" tokennya cuma boleh baca secret/data/dev/*, dan
    # "vault-kv-prod" cuma secret/data/prod/*. Tanpa pemisahan ini, ExternalSecret
    # apa pun di namespace default bisa menarik secret prod - beda path saja
    # cuma konvensi penamaan, bukan batas keamanan.
    #
    # Nilainya di-set paksa oleh workflow deploy (--set vault.storeName), bukan
    # dari file values.
    name: {{ .Values.vault.storeName | default "vault-kv" }}
  target:
    name: {{ include "app.fullname" . }}-vault
    creationPolicy: Owner
  dataFrom:
    {{- if .Values.vault.common.enabled }}
    # 1. Loaded FIRST → becomes the baseline value
    - extract:
        key: {{ .Values.vault.stage }}/{{ .Values.vault.common.key }}
    {{- end }}
    # 2. Loaded later → the same key will overwrite the value from 'common'.
    - extract:
        key: {{ .Values.vault.stage }}/{{ include "app.fullname" . }}
{{- end }}
