replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

env: {}

secretEnv: {}

# Opt-in only. Every release today implicitly runs as the namespace's
# "default" ServiceAccount (this chart never set serviceAccountName before -
# see app.serviceAccountName in _helpers.tpl). Set create: true for a service
# that needs its own identity, e.g. for IRSA (eks.amazonaws.com/role-arn
# annotation) instead of static long-lived cloud credentials in Vault.
serviceAccount:
  create: false
  name: ""
  annotations: {}

vault:
  enabled: true
  # stage dan storeName selalu ditimpa --set oleh workflow deploy. Default di
  # sini sengaja dev supaya `helm template` lokal tetap jalan - jangan pernah
  # diandalkan sebagai sumber kebenaran untuk prod.
  stage: prod
  storeName: vault-kv
  refreshInterval: 1m
  common:
    enabled: true
    key: general

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
